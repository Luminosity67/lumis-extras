name: Extension package

# Builds the zip that is uploaded to the Chrome Web Store. It holds only what
# the extension loads: the manifest, the script and the icons. Tests, docs and
# workflows stay out of it.
#
# Run it by hand (Actions tab -> Extension package -> Run workflow) to get the
# zip as a download, or push a tag named after the version (v1.0.24) to also
# publish it as a GitHub release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check.cjs
      - name: Build the zip
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version $version" >&2
            exit 1
          fi
          zip -X -r "lumis-extras-$version.zip" manifest.json lumis-extras.user.js icons
          unzip -l "lumis-extras-$version.zip"
          echo "ZIP=lumis-extras-$version.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: lumis-extras-extension
          path: ${{ env.ZIP }}
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$ZIP" --title "Lumi's Extras ${GITHUB_REF_NAME#v}" --generate-notes
